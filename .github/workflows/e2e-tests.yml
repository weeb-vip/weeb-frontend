name: "E2E Tests"

on:
  push:
    branches: [develop]  # Only run directly on develop, not main
  # PRs run these via test-status.yml (workflow_call) — a direct
  # pull_request trigger here duplicated the entire suite on every PR
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    # Browsers and their system libraries are already in this image, so the
    # install step is gone. That step was not just slow -- it ran apt-get, which
    # is not covered by the dependency cache, and when a mirror hung it took the
    # whole 30 minute job budget with it. Two shards died that way on one run.
    #
    # The tag MUST match the @playwright/test version bun resolves (currently
    # 1.60.0 per bun.lock). Playwright refuses to run against browsers built for
    # a different version, so bumping the dependency means bumping this too.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      # The image sets HOME=/root; without this, actions that write to the
      # runner's home directory and steps that read it disagree.
      options: --user root
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1/3, 2/3, 3/3]

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # npm, not oven-sh/setup-bun: that action extracts a .zip and the
      # playwright image has no unzip. Installing via npm needs no extra
      # packages, which keeps this job free of apt entirely -- the point of
      # moving to the image in the first place.
      - name: Setup Bun
        run: npm install -g bun

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-e2e-bun-${{ matrix.browser }}-${{ hashFiles('**/bun.lockb', '**/yarn.lock', '**/package-lock.json') }}-${{ hashFiles('**/playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-e2e-bun-${{ matrix.browser }}-
            ${{ runner.os }}-e2e-bun-

      - name: Install dependencies
        run: bun install

      - name: Build for staging
        run: APP_CONFIG=staging bun run build
        env:
          CI: true

      - name: Run E2E tests
        run: bunx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # Aggregate job to check all matrix jobs passed
  e2e-tests-complete:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "E2E tests failed"
            exit 1
          fi
          echo "All E2E tests passed"
