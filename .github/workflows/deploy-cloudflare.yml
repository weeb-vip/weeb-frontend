name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Select a Git tag to deploy'
        required: true
        type: choice
        options:
          - v1.110.2
          - v1.110.1
          - v1.110.0
          - v1.109.1
          - v1.109.0
          - v1.108.0
          - v1.107.0
          - v1.106.0
          - v1.105.0
          - v1.104.1
          - v1.104.0
          - v1.103.4
          - v1.103.3
          - v1.103.2
          - v1.103.1
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages

    steps:
      - name: Checkout specific tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set environment variables
        run: |
          echo "APP_CONFIG=${{ inputs.environment }}" >> $GITHUB_ENV
          echo "VITE_APP_VERSION=${{ inputs.tag }}" >> $GITHUB_ENV

      - name: Build for Cloudflare Pages
        run: |
          echo "Building with SvelteKit Cloudflare adapter..."
          if [ "${{ inputs.environment }}" = "production" ]; then
            NODE_ENV=production DEPLOY_TARGET=cloudflare yarn build --mode production
          else
            NODE_ENV=production DEPLOY_TARGET=cloudflare yarn build --mode staging
          fi

          # Verify the build output structure
          echo "=== Build output structure ==="
          ls -la .svelte-kit/cloudflare/

          if [ -f ".svelte-kit/cloudflare/_worker.js" ]; then
            echo "✅ Found _worker.js"
          else
            echo "❌ Missing _worker.js"
            exit 1
          fi
        env:
          APP_CONFIG: ${{ inputs.environment }}
          VITE_APP_VERSION: ${{ inputs.tag }}
          NODE_ENV: production

      # Runtime secrets, pushed before the deploy so the new version starts with them.
      #
      # These cannot be baked in at build time: SvelteKit reads them through
      # $env/dynamic/private, which on Pages resolves against the deployment's own
      # environment, not the build environment. Setting them in the build step above
      # would leave them undefined at request time.
      #
      # Production only. Staging runs in k8s and takes its config from weeb-argocd.
      # OG_PROBE_SECRET lets /og/<id> check whether a CDN image exists. Cloudflare
      # bot-challenges server-side requests to cdn.weeb.vip/weeb/*, and the WAF rule
      # that lets this origin through matches on an x-og-probe header carrying this
      # value. Without it every anime falls back to the branded default card.
      #
      # The value is piped in rather than typed: wrangler reads stdin when it is not a
      # TTY, so this never blocks waiting for input.
      #
      # This depends on .nvmrc staying at Node 22 or newer — wrangler 4.x refuses to
      # start below that, which is how an earlier version of this step took down a
      # production deploy. If a future wrangler raises its floor again, this breaks
      # here first, before the deploy step.
      - name: Sync runtime secrets to Pages
        if: inputs.environment == 'production'
        run: |
          printf '%s' "$OG_PROBE_SECRET" \
            | yarn wrangler pages secret put OG_PROBE_SECRET --project-name=weeb-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OG_PROBE_SECRET: ${{ secrets.OG_PROBE_SECRET }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./.svelte-kit/cloudflare --project-name=weeb-${{ inputs.environment }} --branch=${{ inputs.environment == 'production' && 'main' || 'staging' }}

      - name: Create deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = `https://weeb-${{ inputs.environment }}.pages.dev`;

            // Create a deployment status
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ inputs.tag }}',
              environment: '${{ inputs.environment }}',
              description: 'Cloudflare Pages deployment',
              auto_merge: false,
              required_contexts: []
            });

            console.log(`Deployed ${{ inputs.tag }} to ${{ inputs.environment }}: ${deploymentUrl}`);

      - name: Notify deployment status
        run: |
          echo "✅ Successfully deployed ${{ inputs.tag }} to ${{ inputs.environment }}"
          echo "🌐 Deployment URL: https://weeb-${{ inputs.environment }}.pages.dev"
